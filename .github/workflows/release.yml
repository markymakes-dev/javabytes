name: Release

# Triggered by pushing a version tag (v1.2.3). Builds the shaded jar and
# attaches it to a GitHub Release, replacing the manual `gh release create`
# step documented in the wiki. npm publishing stays manual on purpose: it
# needs the maintainer's passkey in a real terminal.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and release, e.g. v1.0.1"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Build jar and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # A release tagged v1.2.3 must ship a jar that reports 1.2.3. Failing
      # here is much cheaper than shipping a mislabelled artifact.
      - name: Check tag matches pom version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          POM_VERSION=$(mvn -B help:evaluate -Dexpression=project.version -q -DforceStdout)
          if [ "v${POM_VERSION}" != "${TAG}" ]; then
            echo "::error::tag ${TAG} does not match pom version ${POM_VERSION}"
            exit 1
          fi
          echo "Releasing ${TAG} (pom ${POM_VERSION})"

      - name: Build shaded jar
        run: mvn -B package

      - name: Verify jar is runnable
        run: |
          set -euo pipefail
          test -f target/javabytes.jar
          unzip -p target/javabytes.jar META-INF/MANIFEST.MF | grep -i "^Main-Class:"

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          JAR=target/javabytes.jar
          SHA=$(sha256sum "$JAR" | cut -d' ' -f1)
          SIZE=$(stat -c%s "$JAR")
          cat > NOTES.md <<EOF
          JavaBytes ${TAG}

          ## Install

          ```bash
          npx -y javabytes-mcp
          ```

          Or download the jar below and run `java -jar javabytes.jar` (Java 21+).
          Client configuration: https://github.com/${GITHUB_REPOSITORY}#installation

          ## Asset

          | File | Size | SHA-256 |
          |---|---|---|
          | javabytes.jar | ${SIZE} bytes | ${SHA} |
          EOF

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists; replacing the jar asset."
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "JavaBytes ${TAG}" \
              --verify-tag \
              --notes-file NOTES.md
          fi

      - name: Summarise follow-up
        run: |
          {
            echo "### Release ${TAG} published"
            echo ""
            echo "Remaining manual step: publish the npm package."
            echo ""
            echo '```'
            echo "cd npm"
            echo "npm version <version>                        # keep equal to the pom version"
            echo "npm publish --access public                  # needs a real terminal + passkey"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
