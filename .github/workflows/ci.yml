name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: Java 21 build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # `package` rather than `test` so the shaded jar and its relocations are
      # exercised too: shade breakage is a release-blocking failure that unit
      # tests alone cannot see.
      - name: Build and test
        run: mvn -B package

  npm:
    name: npm launcher tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 18 is the floor `engines` declares; 22 is a current LTS.
        node: ["18", "22"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # The launcher tests are pure unit tests over jar/JVM resolution; they do
      # not need the shaded jar, a JDK, or a database.
      - name: Run launcher tests
        working-directory: npm
        run: npm test
